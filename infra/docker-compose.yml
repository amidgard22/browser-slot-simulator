services:
  postgres:
    image: postgres:16
    container_name: postgres_slot_game
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - slot_game_network
    restart: always

volumes:
  postgres_data:

networks:
  slot_game_network:
    driver: bridge
